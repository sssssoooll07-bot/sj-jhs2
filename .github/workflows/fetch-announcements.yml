name: 공고 자동 수집 (매일 08:00 KST)

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC = 다음날 08:00 KST
  workflow_dispatch: {} # 수동 실행도 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공고 수집 (JNTP + SMTECH)
        run: node scripts/fetch-announcements.mjs

      - name: 변경 감지
        id: diff
        run: |
          if git diff --quiet public/announcements.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 커밋·배포 생략"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 변경 시 커밋 → Vercel 자동 재배포
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/announcements.json
          git commit -m "공고 자동 수집: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M KST')"
          git push

      # ── Firebase Hosting에도 자동 반영 (Vercel과 별개로 web.app 사이트 갱신) ──
      # 예약 실행: 변경분이 있을 때만. 수동 실행(Run workflow): 항상 배포(테스트·온디맨드 갱신용).
      - name: 의존성 설치 & 정적 빌드
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run build

      - name: Firebase Hosting 배포
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 Firebase 배포를 건너뜁니다(Vercel은 정상). 저장소 Settings → Secrets에 등록하세요."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting --project sj-jhs-deploy1 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
